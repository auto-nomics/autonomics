[package]
name = "dl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deep learning algorithms — Burn-based neural networks for the DAG engine."

[lib]
name = "dl"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = "0.9"
rand_chacha = "0.9"

# Burn — deep learning framework with autodiff.
# default-features = false to avoid burn-dataset/sqlite conflict with rusqlite.
burn = { version = "0.14", default-features = false, features = ["std"] }
burn-ndarray = "0.14"
burn-autodiff = "0.14"

[lints]
workspace = true
