[package]
name = "container-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
thiserror.workspace = true
toml.workspace = true
schemars.workspace = true
futures.workspace = true
sha2.workspace = true
fs4 = "0.13.1"
libc = "0.2"
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"

container-runtime = { path = "../container-runtime" }
data-catalog = { path = "../data-catalog" }
dag-core = { path = "../dag-core" }
nodes-io = { path = "../node-bundles/nodes-io", default-features = false }

[features]
official-r-reference = []

[dev-dependencies]
tempfile = "3"
datafusion.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
vfs = { path = "../vfs" }
data-catalog = { path = "../data-catalog", features = ["test-util"] }

[lints]
workspace = true

