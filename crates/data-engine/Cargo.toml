[package]
name = "data-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
dag-core = { path = "../dag-core" }
thiserror.workspace = true
biofusion = { path = "../biofusion" }
datalake = { path = "../datalake" }
fs = { path = "../fs" }
serde = { workspace = true, features = ["derive"] }
iceberg.workspace = true
iceberg-catalog-rest.workspace = true
datafusion.workspace = true
tokio = { workspace = true }
arrow = { workspace = true, features = ["prettyprint"] }
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
parquet.workspace = true
serde_json = { workspace = true }
nanoid = "0.5.0"
async-trait.workspace = true
petgraph = "0.8"
tracing.workspace = true
futures.workspace = true
ahash = "0.8"
blake3 = "1.8.5"
derive_more.workspace = true
opentargets = { path = "../opentargets" }
opengwas = { path = "../opengwas" }
ldsc = { path = "../../bio_crates/ldsc" }
lava = { path = "../../bio_crates/lava" }
hdl = { path = "../../bio_crates/hdl" }
mixer = { path = "../../bio_crates/mixer" }
mr = { path = "../../bio_crates/mr" }
lcv = { path = "../../bio_crates/lcv" }
mtag = { path = "../../bio_crates/mtag" }
mrlap = { path = "../../bio_crates/mrlap" }
cpassoc = { path = "../../bio_crates/cpassoc" }
magma = { path = "../../bio_crates/magma" }
susie = { path = "../../bio_crates/susie" }
evalue = { path = "../../bio_crates/evalue" }
mrpresso = { path = "../../bio_crates/mrpresso" }
coloc = { path = "../../bio_crates/coloc" }
bkmr = { path = "../../bio_crates/bkmr" }
mvmr = { path = "../../bio_crates/mvmr" }
statkit = { path = "../../stat_crates/statkit" }
epi = { path = "../../stat_crates/epi" }
hypothesize = { path = "../../stat_crates/hypothesize" }
cmprsk = { path = "../../stat_crates/cmprsk" }
lcmm = { path = "../../bio_crates/lcmm" }
survey = { path = "../../stat_crates/survey" }
ml = { path = "../../stat_crates/ml" }
faer.workspace = true
schemars.workspace = true
visualization = { path = "../visualization" }
statrs = "0.18"
turso.workspace = true
chrono.workspace = true

# ── Node bundle plugins (optional) ────────────────────────────────────────
nodes-hypothesize = { path = "../node-bundles/nodes-hypothesize", optional = true }
nodes-ml = { path = "../node-bundles/nodes-ml", optional = true }
nodes-viz = { path = "../node-bundles/nodes-viz", optional = true }
nodes-sql = { path = "../node-bundles/nodes-sql", optional = true }
nodes-regression = { path = "../node-bundles/nodes-regression", optional = true }
nodes-survival = { path = "../node-bundles/nodes-survival", optional = true }
nodes-coloc = { path = "../node-bundles/nodes-coloc", optional = true }
nodes-epi = { path = "../node-bundles/nodes-epi", optional = true }
nodes-io = { path = "../node-bundles/nodes-io", optional = true }
nodes-causal = { path = "../node-bundles/nodes-causal", optional = true }
nodes-lcmm = { path = "../node-bundles/nodes-lcmm", optional = true }
nodes-mr = { path = "../node-bundles/nodes-mr", optional = true }
nodes-survey = { path = "../node-bundles/nodes-survey", optional = true }
nodes-ldsc = { path = "../node-bundles/nodes-ldsc", optional = true }
nodes-genetics = { path = "../node-bundles/nodes-genetics", optional = true }

[features]
default = ["bundle-hypothesize", "bundle-ml", "bundle-viz", "bundle-sql", "bundle-regression", "bundle-survival", "bundle-coloc", "bundle-epi", "bundle-io", "bundle-causal", "bundle-lcmm", "bundle-mr", "bundle-survey", "bundle-ldsc", "bundle-genetics"]
bundle-hypothesize = ["dep:nodes-hypothesize"]
bundle-ml = ["dep:nodes-ml"]
bundle-viz = ["dep:nodes-viz"]
bundle-sql = ["dep:nodes-sql"]
bundle-regression = ["dep:nodes-regression"]
bundle-survival = ["dep:nodes-survival"]
bundle-coloc = ["dep:nodes-coloc"]
bundle-epi = ["dep:nodes-epi"]
bundle-io = ["dep:nodes-io"]
bundle-causal = ["dep:nodes-causal"]
bundle-lcmm = ["dep:nodes-lcmm"]
bundle-mr = ["dep:nodes-mr"]
bundle-survey = ["dep:nodes-survey"]
bundle-ldsc = ["dep:nodes-ldsc"]
bundle-genetics = ["dep:nodes-genetics"]

[dev-dependencies]
datalake = { path = "../datalake" }
iceberg.workspace = true
arrow-buffer.workspace = true
tempfile = "3"
csv = "1"
