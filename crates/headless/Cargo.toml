[package]
name = "headless"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless (non-interactive) execution of agentik agents"

[dependencies]
agentik-core = { path = "../agentik-core" }
agentik-sdk = { path = "../agentik-sdk" }
agentik-types = { path = "../agentik-types" }
arc-swap.workspace = true
runtime = { path = "../runtime" }
gateway = { path = "../gateway" }
eventsource-stream = "0.2"
futures.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
toml = { workspace = true }
uuid = { version = "1.12", features = ["v4", "serde"] }
vfs = { path = "../vfs" }

[dev-dependencies]
agentik-sdk = { path = "../agentik-sdk", features = ["test-util"] }
gateway = { path = "../gateway", features = ["test-util"] }

[lints]
workspace = true
