[package]
name = "api-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Composable local HTTP API server hosted by the Autonomics gateway daemon."

[dependencies]
zip.workspace = true
manuscript-engine = { path = "../manuscript-engine" }
manuscript-core = { path = "../manuscript-core" }
bioart = { path = "../bioart" }
bioicons = { path = "../bioicons" }
visualization = { path = "../visualization" }
visualization-assets = { path = "../visualization-assets" }
bib-base = { path = "../bib-base" }
bib-types = { path = "../bib-types" }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
chrono.workspace = true
opendal = "0.57"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
uuid = { version = "1.23", features = ["v4"] }
vfs = { path = "../vfs" }
wiki = { path = "../wiki", features = ["vfs"] }
ppt-base = { path = "../ppt-base", features = ["vfs"] }
ppt-types = { path = "../ppt-types" }

[dev-dependencies]
agentik-core = { path = "../agentik-core" }
agentik-sdk = { path = "../agentik-sdk" }
rusqlite = "0.40.1"
visualization-tools = { path = "../visualization-tools" }
turso.workspace = true
async-trait.workspace = true
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
