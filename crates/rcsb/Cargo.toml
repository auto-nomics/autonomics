[package]
name = "rcsb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Async Rust SDK for RCSB PDB with DAG source nodes and agent tools."

[dependencies]
agentik-core = { path = "../agentik-core" }
agentik-proc = { path = "../agentik-proc" }
agentik-sdk = { path = "../agentik-sdk" }
async-trait.workspace = true
dag-core = { path = "../dag-core" }
reqwest = { version = "0.13", features = ["json"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "fs"] }

# DAG table emission
arrow-array.workspace = true
arrow-schema.workspace = true
datafusion.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
