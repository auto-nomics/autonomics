[package]
name = "agentik-memory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Persistent cross-session memory domain model and pipeline."
license.workspace = true

[dependencies]
agentik-sdk = { path = "../agentik-sdk" }
agentik-types = { path = "../agentik-types" }
arc-swap.workspace = true
async-trait = "0.1"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"
uuid = { version = "1.12", features = ["v4", "serde"] }

[dev-dependencies]
agentik-sdk = { path = "../agentik-sdk", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
