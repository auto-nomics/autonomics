[package]
name = "agentik-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Domain-agnostic agent runtime. Plug in any AgentContext to specialize."
license.workspace = true

[dependencies]
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
uuid = { version = "1.12", features = ["v4", "serde"] }
agentik-sdk = { path = "../agentik-sdk" }
agentik-types = { path = "../agentik-types" }
agentik-memory = { path = "../agentik-memory" }
agentik-proc = { path = "../agentik-proc" }
async-trait.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
turso.workspace = true
regex = "1"
tokio-util = { version = "0.7", features = ["rt"] }
arc-swap.workspace = true
chrono = { workspace = true }
schemars.workspace = true

[dev-dependencies]
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Enables `MessageStream::from_events` for mock-backed streaming tests.
agentik-sdk = { path = "../agentik-sdk", features = ["test-util"] }

[lints]
workspace = true
