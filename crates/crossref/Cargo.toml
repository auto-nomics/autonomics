[package]
name = "crossref"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Async Rust SDK for the Crossref REST API with agent tools and DAG nodes."

[dependencies]
bib-types = { path = "../bib-types" }
schemars.workspace = true
agentik-core = { path = "../agentik-core" }
agentik-proc = { path = "../agentik-proc" }
agentik-sdk = { path = "../agentik-sdk" }
dag-core = { path = "../dag-core" }
async-trait = { workspace = true }
reqwest = { version = "0.13", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# DAG node dependencies
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
datafusion = { version = "53" }
tracing = { workspace = true }
resource-catalog = { path = "../resource-catalog" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
agentik-types = { path = "../agentik-types" }
datalake = { path = "../datalake" }
bib-types = { path = "../bib-types" }
serial_test = "3"

[lints]
workspace = true
