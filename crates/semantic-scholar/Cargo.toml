[package]
name = "semantic-scholar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Async Rust SDK for the Semantic Scholar Academic Graph API with agent tools."

[dependencies]
bib-types = { path = "../bib-types" }
agentik-core = { path = "../agentik-core" }
agentik-proc = { path = "../agentik-proc" }
agentik-sdk = { path = "../agentik-sdk" }
async-trait = { workspace = true }
reqwest = { version = "0.13", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
resource-catalog = { path = "../resource-catalog" }

schemars.workspace = true
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serial_test = "3"

[lints]
workspace = true
