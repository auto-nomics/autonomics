[package]
name = "tui-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Composable local HTTP API backend started alongside the Autonomics TUI."

[features]
# Serve resident runtime-hosted agents (`/api/v1/agent/threads`) alongside
# the ephemeral chat endpoint. Off by default: the minimal embeddable host
# (e.g. the desktop shell) does not link the runtime crate.
runtime-host = ["dep:runtime"]

[dependencies]
bib-base = { path = "../bib-base" }
bib-types = { path = "../bib-types" }
agentik-core = { path = "../agentik-core" }
agentik-sdk = { path = "../agentik-sdk" }
agentik-types = { path = "../agentik-types" }
runtime = { path = "../runtime", optional = true }
arc-swap.workspace = true
axum = { version = "0.8", features = ["multipart"] }
chrono.workspace = true
futures.workspace = true
mime_guess = "2"
opendal = "0.57"
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
uuid = { version = "1.23", features = ["v4"] }
vfs = { path = "../vfs" }

[dev-dependencies]
agentik-core = { path = "../agentik-core" }
agentik-sdk = { path = "../agentik-sdk" }
agentik-types = { path = "../agentik-types" }
arc-swap.workspace = true
async-trait.workspace = true
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
zip = { workspace = true }

[lints]
workspace = true
