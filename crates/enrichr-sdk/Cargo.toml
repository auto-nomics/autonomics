[package]
name = "enrichr-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Async Rust SDK for the Enrichr and Speedrichr gene-set enrichment APIs."

[dependencies]
agentik-core = { path = "../agentik-core" }
agentik-proc = { path = "../agentik-proc" }
agentik-sdk = { path = "../agentik-sdk" }
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait = { workspace = true }
dag-core = { path = "../dag-core" }
datafusion.workspace = true
reqwest = { version = "0.13", features = ["form", "json", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
