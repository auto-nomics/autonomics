[package]
name = "resource-downloader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Central, policy-gated, multi-protocol resource downloader for Autonomics agents"

[features]
default = ["http", "object-store", "agent-tools"]
http = ["dep:reqwest"]
object-store = ["opendal/services-s3", "opendal/services-oss"]
agent-tools = [
  "dep:agentik-core",
  "dep:agentik-proc",
  "dep:agentik-sdk",
  "dep:schemars",
]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
sha2.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"], optional = true }
bytes = "1"
percent-encoding = "2"
toml.workspace = true
url = "2"
opendal.workspace = true

agentik-core = { path = "../agentik-core", optional = true }
agentik-proc = { path = "../agentik-proc", optional = true }
agentik-sdk = { path = "../agentik-sdk", optional = true }
schemars = { workspace = true, optional = true }
vfs = { path = "../vfs" }

[dev-dependencies]
tempfile = "3.27"
wiremock = "0.6"

[lints]
workspace = true
