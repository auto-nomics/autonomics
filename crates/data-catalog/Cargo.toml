[package]
name = "data-catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Versioned object-storage catalog for external analysis data packages."

[dependencies]
clap.workspace = true
dag-core = { path = "../dag-core" }
flate2 = "1.1"
opendal.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
toml.workspace = true
uuid.workspace = true
vfs = { path = "../vfs" }
zstd = "0.13"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
