[package]
name = "hpc-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authenticated account filesystem and Slurm tools for HPC agents"

[dependencies]
vfs = { path = "../vfs" }
base64 = "0.22"
futures.workspace = true
agentik-core = { path = "../agentik-core" }
agentik-proc = { path = "../agentik-proc" }
agentik-sdk = { path = "../agentik-sdk" }
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time"] }
sha2.workspace = true
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
