[package]
name = "biofusion"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Apache Arrow DataFusion integration for JSON and bioinformatics file formats (VCF, BCF, FASTA, FASTQ, BED, GTF, GFF, SAM, BAM, CRAM, BigWig, BigBed)"
keywords = ["bioinformatics", "datafusion", "arrow", "genomics", "vcf"]
categories = ["science"]

[dependencies]
datafusion.workspace = true
datafusion-datasource = "53"
arrow.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
oxbow = { workspace = true }
noodles = { workspace = true, features = [
    "vcf",
    "bgzf",
    "bcf",
    "fasta",
    "fastq",
    "bed",
    "gtf",
    "gff",
    "sam",
    "bam",
    "cram",
    "tabix",
    "csi",
] }
bigtools = { version = "0.5", default-features = false, features = ["read"] }
flate2 = "1.1"
futures.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
bytes = "1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
