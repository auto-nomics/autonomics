[package]
name = "bib-base"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bibliography management: Turso storage + unified literature query gateway."

[dependencies]
bib-types = { path = "../bib-types" }
turso.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror.workspace = true
tokio.workspace = true

# Unified query layer
eutils = { path = "../eutils" }
arxiv = { path = "../arxiv" }
futures = { workspace = true }
async-trait.workspace = true
tracing.workspace = true
uuid = { version = "1.12", features = ["v4"] }
pdf-extract = "0.7"
reqwest = { version = "0.13", features = ["json"] }

# Europe PMC open-access full-text auto-fetch
europepmc = { path = "../europepmc" }

# Agent tools
agentik-core = { path = "../agentik-core" }
agentik-proc = { path = "../agentik-proc" }
agentik-sdk = { path = "../agentik-sdk" }
schemars.workspace = true

[lints]
workspace = true

[features]
# Enables live-API end-to-end tests (require network connectivity).
e2e = []

[dev-dependencies]
tokio = { workspace = true }
