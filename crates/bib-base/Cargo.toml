[package]
name = "bib-base"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bibliography management: Turso storage + unified literature query gateway."

[dependencies]
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
manuscript-core = { path = "../manuscript-core" }
bib-types = { path = "../bib-types" }
text-embedding = { path = "../text-embedding" }
turso.workspace = true
tantivy = "=0.26.2"
ahash = { version = "=0.8.12", default-features = false, features = ["runtime-rng"] }
jieba-rs = "=0.11.0"
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
chrono = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }

# Unified query layer
eutils = { path = "../eutils" }
arxiv = { path = "../arxiv" }
futures = { workspace = true }
async-trait.workspace = true
tracing.workspace = true
uuid = { version = "1.12", features = ["v4"] }
reqwest = { version = "0.13", features = ["json"] }
zip = { workspace = true }  # workspace pins deflate-only features
opendal.workspace = true

# Europe PMC open-access full-text auto-fetch
europepmc = { path = "../europepmc" }

# Additional literature sources integrated into the LiteratureGateway.
openalex = { path = "../openalex" }
crossref = { path = "../crossref" }
semantic-scholar = { path = "../semantic-scholar" }

# Agent tools
agentik-core = { path = "../agentik-core" }
agentik-proc = { path = "../agentik-proc" }
agentik-sdk = { path = "../agentik-sdk" }
schemars.workspace = true
sha2 = "0.10"
quick-xml = { version = "0.38", features = ["serialize"] }
regex = "1"
base64 = "0.22"
vfs = { path = "../vfs" }

# Local PubMed DuckDB mirror (feature `pubmed_local`). Links the **system**
# DuckDB (Arch: `pacman -S duckdb`) — the bundled engine is 5–20× slower on
# the mirror's hash joins than the distribution build, and the mirror's
# indexes/FTS were built by the system CLI. Build-time requirements:
#   DUCKDB_LIB_DIR=/usr/lib DUCKDB_INCLUDE_DIR=/usr/include
# `buildtime_bindgen` regenerates bindings from the installed headers.
duckdb = { version = "1.20000", default-features = false, features = ["buildtime_bindgen"], optional = true }

# DAG evidence-channel nodes (see `src/nodes/`); pulls no node-registry
# features beyond the factory/node traits.
dag-core = { path = "../dag-core" }
arrow-array.workspace = true
arrow-schema.workspace = true

[lints]
workspace = true

[features]
# Enables live-API end-to-end tests (require network connectivity).
e2e = []
# Local PubMed DuckDB mirror (read-only, ~74 GB): registers a
# `pubmed_local` literature source and the high-throughput DAG nodes.
pubmed_local = ["dep:duckdb"]

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
# Test-only: constructing a `NodeCtx` needs a DataFusion runtime env.
datafusion.workspace = true
