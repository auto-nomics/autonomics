[package]
name = "grf-sys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust FFI bindings for the GRF (Generalized Random Forests) C++ core. Vendored at vendor/grf/."

[lib]
name = "grf_sys"
path = "src/lib.rs"

[build-dependencies]
# `cc` crate drives compilation of both the vendored GRF core and the C ABI wrapper.
cc = { version = "1.2", features = ["parallel"] }

[dependencies]
thiserror.workspace = true
libc = "0.2"

[lints]
workspace = true