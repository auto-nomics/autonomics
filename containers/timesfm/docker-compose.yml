services:
  timesfm:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/atc/timesfm:3.0.2
    ports:
      - "8000:8000"
    environment:
      TIMESFM_CHECKPOINT: ${TIMESFM_CHECKPOINT:-google/timesfm-3.0-pytorch}
      TIMESFM_DEVICE: ${TIMESFM_DEVICE:-cpu}
      TIMESFM_EAGER_LOAD: ${TIMESFM_EAGER_LOAD:-false}
    volumes:
      - timesfm-cache:/cache/timesfm

volumes:
  timesfm-cache:
