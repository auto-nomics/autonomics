name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (cheap on a slow-building workspace).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The repo's .cargo/config.toml pins a host-local target dir (/mnt/disk2/target)
  # that does not exist on CI runners. A plain relative path overrides it (env
  # takes precedence over config) and needs no `runner` context, which isn't
  # available in `env:` blocks.
  CARGO_TARGET_DIR: target

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Full debug info makes the largest workspace test binaries multiple GB.
      # Line tables keep useful CI backtraces while avoiding the runner's
      # linker-time disk and memory ceiling.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # Limit the number of test binaries linked concurrently.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - name: Check runner resources before tests
        run: |
          set -euo pipefail
          df -h / /home/runner/work
          free -h
          du -sh target "${CARGO_HOME:-$HOME/.cargo}/registry" 2>/dev/null || true
      # Runs all non-#[ignore] tests. Live-network tests are #[ignore]d and/or
      # env-gated, so this stays green without external credentials.
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Check runner resources after tests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          df -h / /home/runner/work
          free -h
          du -sh target "${CARGO_HOME:-$HOME/.cargo}/registry" 2>/dev/null || true
