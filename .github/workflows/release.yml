name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
  CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-cpu=generic -C linker-features=-lld
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            rustflags: -C target-cpu=generic
          - os: macos-14
            target: aarch64-apple-darwin
            # ring relies on the Apple Silicon target's default CPU features;
            # target-cpu=generic drops them and trips its const assertions.
            rustflags: ""
          - os: macos-15-large
            target: x86_64-apple-darwin
            rustflags: -C target-cpu=generic

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96
        with:
          target: ${{ matrix.target }}
      - name: Install Rust target
        run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build release binary
        run: cargo build --release --locked -p autonomics --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Package release binary
        run: |
          set -euo pipefail
          mkdir dist
          cp "target/$TARGET/release/autonomics" dist/autonomics
          tar -C dist -czf "dist/autonomics-$TARGET.tar.gz" autonomics
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: autonomics-${{ matrix.target }}
          path: dist/autonomics-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum autonomics-*.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/autonomics-*.tar.gz dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/autonomics-*.tar.gz dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
