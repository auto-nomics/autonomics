# =============================================================================
# Autonomics object-storage test stack
#   garage (S3) + garage-webui
# =============================================================================
# Usage (from infra/docker/):
#   The unified .env / .env.example live at the workspace root (../../).
#   cp ../../.env.example ../../.env   # fill in real secrets, then:
#   make up
# =============================================================================

services:
  # ── Object Storage (S3-compatible) ──────────────────────────────────────
  # docker.io/dxflrs/garage:v2.0.0 is shell-less, so we can't run an entrypoint
  # script. The garage.toml is rendered on the host (see Makefile target
  # `garage-config`) and bind-mounted at the binary's default config
  # path. The image's own Cmd is `["/garage", "server"]`, so we leave
  # entrypoint unset.
  garage:
    image: docker.io/dxflrs/garage:v2.0.0
    container_name: garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ${GARAGE_META_DIR:-./.data/meta}:/var/lib/garage/meta
      - ${GARAGE_SNAPSHOTS_DIR:-./.data/snapshots}:/var/lib/garage/snapshots
      - ${GARAGE_DATA_DIR_DISK1:-./.data/disk1}:/mnt/disk1
      # - ${GARAGE_DATA_DIR_DISK2:-/mnt/disk2/garage/data}:/mnt/disk2
    networks:
      - garage_net
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # RPC
      - "3902:3902" # Web
      - "3903:3903" # Admin
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Garage Web UI ────────────────────────────────────
  webui:
    image: docker.io/khairul169/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    networks:
      - garage_net
    ports:
      - 3909:3909
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"

networks:
  garage_net:
    driver: bridge
