apiVersion: v1
kind: Namespace
metadata:
  name: autonomics
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: autonomics-workspace
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: autonomics-local
  local:
    path: /var/lib/autonomics/k3s/workspace
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autonomics-workspace
  namespace: autonomics
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  volumeName: autonomics-workspace
  storageClassName: autonomics-local
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: autonomics-panels
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: autonomics-local
  local:
    path: /var/lib/autonomics/k3s/panels
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autonomics-panels
  namespace: autonomics
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Ti
  volumeName: autonomics-panels
  storageClassName: autonomics-local
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autonomics-isolated
  namespace: autonomics
spec:
  podSelector:
    matchLabels:
      autonomics.io/network: isolated
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autonomics-cluster-dns
  namespace: autonomics
spec:
  podSelector:
    matchLabels:
      autonomics.io/network: cluster
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autonomics-egress
  namespace: autonomics
spec:
  podSelector:
    matchLabels:
      autonomics.io/network: egress
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - {}
