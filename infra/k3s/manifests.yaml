apiVersion: v1
kind: Namespace
metadata:
  name: autonomics
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: autonomics-workspace
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: autonomics-local
  local:
    path: /var/lib/autonomics/k3s/workspace
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autonomics-workspace
  namespace: autonomics
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  volumeName: autonomics-workspace
  storageClassName: autonomics-local
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: autonomics-panels
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: autonomics-local
  local:
    path: /home/wjx/.autonomics/panels
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autonomics-panels
  namespace: autonomics
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Ti
  volumeName: autonomics-panels
  storageClassName: autonomics-local
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: autonomics-registry
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: autonomics-local
  local:
    path: /var/lib/autonomics/k3s/registry
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autonomics-registry
  namespace: autonomics
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: autonomics-registry
  storageClassName: autonomics-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomics-registry
  namespace: autonomics
  labels:
    app.kubernetes.io/name: autonomics-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autonomics-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autonomics-registry
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          env:
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autonomics-registry
---
apiVersion: v1
kind: Service
metadata:
  name: autonomics-registry
  namespace: autonomics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: autonomics-registry
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autonomics-isolated
  namespace: autonomics
spec:
  podSelector:
    matchLabels:
      autonomics.io/network: isolated
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autonomics-cluster-dns
  namespace: autonomics
spec:
  podSelector:
    matchLabels:
      autonomics.io/network: cluster
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autonomics-egress
  namespace: autonomics
spec:
  podSelector:
    matchLabels:
      autonomics.io/network: egress
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - {}
