[package]
name = "grf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust port of R grf (Generalized Random Forests), backed by grf-sys (direct C++ FFI)."

[lib]
name = "grf"
path = "src/lib.rs"

[dependencies]
grf-sys = { path = "../../crates/grf-sys" }
thiserror.workspace = true
statkit = { path = "../../stat_crates/statkit" }
serde = { workspace = true, features = ["derive"] }
schemars.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true