[package]
name = "magma"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "magma"
path = "src/lib.rs"

[dependencies]
faer.workspace = true
thiserror.workspace = true
# χ² / gamma survival functions — reproduces R's pchisq / pgamma (lower.tail=F).
