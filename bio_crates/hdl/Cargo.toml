[package]
name = "hdl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "hdl"
path = "src/lib.rs"

[dependencies]
faer.workspace = true
thiserror.workspace = true
# Reuse LAVA's leaf primitives: PLINK `.bed` loader (`lava::plink`), allele
# alignment (`lava::align`), distribution functions (`lava::stats`), and the
# symmetric eigendecomposition (`lava::decompose::sym_eigen`) — the HDL-L LD
# reference needs the raw eigenpairs (lam, V) of the LD correlation matrix,
# which LAVA already computes internally.
lava = { path = "../lava" }
# χ² quantiles for the likelihood-based CI cutoff c = exp(-qchisq(1-alpha,1)/2).
# Matches the `lava`/`mr` convention (statrs for χ²/F survival + inverse CDF).
statrs = "0.18"
rayon = { workspace = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
