[package]
name = "lcv"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "lcv"
path = "src/lib.rs"

[dependencies]
faer.workspace = true
thiserror.workspace = true
# Student's t density (`dt`) and CDF (`pt`) — reproduces R's t-distribution
# functions used by the LCV likelihood grid and p-values.
statrs = "0.18"
# Seeded RNG (ChaCha8) for reproducible LCV simulation.
rand = "0.9"
rand_distr = "0.5"
rand_chacha = "0.9"
rayon = { workspace = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
