[package]
name = "rdlocrand"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust port of rdlocrand: local randomization inference for RD designs."

[lib]
name = "rdlocrand"
path = "src/lib.rs"

[dependencies]
rdrobust = { path = "../rdrobust" }
statrs = "0.18"
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
schemars.workspace = true
rand = "0.9"
rand_chacha = "0.9"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
