[package]
name = "mrlap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mrlap"
path = "src/lib.rs"

[dependencies]
faer.workspace = true
thiserror.workspace = true
# Normal distribution functions (pnorm / qnorm / dnorm) — reproduces R's stats.
statrs = "0.18"
# Seeded RNG (ChaCha8) for the parametric-bootstrap variance of the corrected
# effect (`get_correctedSE` in the R reference).
rand = "0.9"
rand_distr = "0.5"
rand_chacha = "0.9"
tracing.workspace = true
# The LDSC (cross-trait rg / gencov / h²) stage runs on the engine vendored in
# src/ldsc_regress/ (formerly the removed `ldsc` crate); the IVW-MR / Egger
# stage uses the estimators vendored in src/mr_estimators.rs (formerly the
# removed `mr` crate).

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
