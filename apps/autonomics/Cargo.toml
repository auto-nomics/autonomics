[package]
name = "autonomics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
color-eyre = "0.6.5"
# The interactive frontend (app/widgets/xai_textarea) lives in the
# autonomics-tui crate; the binary keeps the CLI, one-shot commands,
# the daemon (`serve`) and readiness diagnostics.
autonomics-tui = { path = "../../crates/autonomics-tui" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
gateway = { path = "../../crates/gateway" }
agentik-core = { path = "../../crates/agentik-core" }
agentik-types = { path = "../../crates/agentik-types" }
container-plugin = { path = "../../crates/container-plugin" }
text-embedding = { path = "../../crates/text-embedding" }
plugin-rsi = { path = "../../crates/plugin-rsi" }
data-catalog = { path = "../../crates/data-catalog" }
container-runtime = { path = "../../crates/container-runtime" }
tokio-util = { version = "0.7", features = ["rt"] }
headless = { path = "../../crates/headless" }
kms = { path = "../../crates/kms" }
dag-core = { path = "../../crates/dag-core" }
nodes-io = { path = "../../crates/node-bundles/nodes-io" }
opengwas = { path = "../../crates/opengwas" }
bib-base = { path = "../../crates/bib-base" }
vfs = { path = "../../crates/vfs" }
chrono = { workspace = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["macros"] }
uuid = "1.23.3"
tokio = { workspace = true, features = ["signal", "time", "rt"] }
serde_json.workspace = true
clap = { version = "4.6.1", features = ["derive"] }

[lints]
workspace = true

