<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- AI 模型图标：抽象的芯片/神经网络符号 -->
  <!-- 外框：圆角矩形代表芯片主体 -->
  <rect x="5" y="5" width="14" height="14" rx="2" ry="2"/>
  <!-- 左侧引脚 -->
  <line x1="1" y1="9" x2="5" y2="9"/>
  <line x1="1" y1="12" x2="5" y2="12"/>
  <line x1="1" y1="15" x2="5" y2="15"/>
  <!-- 右侧引脚 -->
  <line x1="19" y1="9" x2="23" y2="9"/>
  <line x1="19" y1="12" x2="23" y2="12"/>
  <line x1="19" y1="15" x2="23" y2="15"/>
  <!-- 上方引脚 -->
  <line x1="9" y1="1" x2="9" y2="5"/>
  <line x1="12" y1="1" x2="12" y2="5"/>
  <line x1="15" y1="1" x2="15" y2="5"/>
  <!-- 下方引脚 -->
  <line x1="9" y1="19" x2="9" y2="23"/>
  <line x1="12" y1="19" x2="12" y2="23"/>
  <line x1="15" y1="19" x2="15" y2="23"/>
  <!-- 内部神经网络节点 -->
  <circle cx="10" cy="10" r="1" fill="currentColor" stroke="none"/>
  <circle cx="14" cy="10" r="1" fill="currentColor" stroke="none"/>
  <circle cx="10" cy="14" r="1" fill="currentColor" stroke="none"/>
  <circle cx="14" cy="14" r="1" fill="currentColor" stroke="none"/>
  <!-- 内部神经网络连线 -->
  <line x1="10" y1="10" x2="14" y2="10" stroke-width="0.8"/>
  <line x1="10" y1="10" x2="10" y2="14" stroke-width="0.8"/>
  <line x1="14" y1="10" x2="14" y2="14" stroke-width="0.8"/>
  <line x1="10" y1="14" x2="14" y2="14" stroke-width="0.8"/>
  <line x1="10" y1="10" x2="14" y2="14" stroke-width="0.8"/>
  <line x1="14" y1="10" x2="10" y2="14" stroke-width="0.8"/>
</svg>
