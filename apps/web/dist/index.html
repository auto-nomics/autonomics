    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*;" />

    <!-- ===== 防止 FOUC（Flash of Unstyled Content）内联脚本 ===== -->
    <!-- 在 React 应用加载前立即执行，从 localStorage 读取用户主题偏好 -->
    <!-- 这样可以避免页面先显示浅色主题，然后切换到深色主题的闪烁效果 -->
    <script>
    try { // 使用 try-catch 防止 localStorage 访问失败（如隐私模式）
      // 从 localStorage 读取 Zustand 持久化的应用状态
      var stored = JSON.parse(localStorage.getItem('jayread-app-storage')); // 获取持久化存储
      // 提取主题设置，默认为 'light'
      var theme = (stored && stored.state && stored.state.theme) || 'light';
      // 如果是 auto 模式，解析为系统主题偏好
      if (theme === 'auto') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      // 在 HTML 根元素上设置 data-theme 属性，使 CSS 变量立即生效
      document.documentElement.setAttribute('data-theme', theme);
    } catch(e) { // 如果 localStorage 不可用或解析失败
      // 降级到浅色主题
      document.documentElement.setAttribute('data-theme', 'light');
    }
    </script>
