[package]
name = "autonomics-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Autonomics desktop GUI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart"] }
base64 = "0.22"
futures-util = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
arxiv = { path = "../../../crates/arxiv" }
crossref = { path = "../../../crates/crossref" }
semantic-scholar = { path = "../../../crates/semantic-scholar" }
async-trait.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
api-server = { path = "../../../crates/api-server" }
bib-base = { path = "../../../crates/bib-base" }
bib-types = { path = "../../../crates/bib-types" }
vfs = { path = "../../../crates/vfs" }
