[package]
name = "reprobio-adapter"
version = "0.1.0"
edition = "2024"

[dependencies]
agentik-sdk = { path = "../../crates/agentik-sdk" }
clap.workspace = true
headless = { path = "../../crates/headless" }
runtime = { path = "../../crates/runtime" }
rusqlite = "0.40.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
toml = "0.8"
uuid = { version = "1.12", features = ["v4", "serde"] }
vfs = { path = "../../crates/vfs" }

[dev-dependencies]
agentik-sdk = { path = "../../crates/agentik-sdk", features = ["test-util"] }
agentik-types = { path = "../../crates/agentik-types" }
tempfile = "3"

[lints]
workspace = true
