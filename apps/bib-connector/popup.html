<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Save to Autonomics</title><link rel="stylesheet" href="style.css">
<body><h1>Save to Autonomics</h1><form id="settings"><label>Gateway URL<input id="origin" type="url" value="http://127.0.0.1:8765" required></label><label>Gateway token<input id="token" type="password" autocomplete="off" required></label><button>Connect</button></form>
<p id="status" role="status" aria-live="polite"></p>
<form id="capture"><label>Title<input id="title" required></label><label>Authors (one per line)<textarea id="authors"></textarea></label><div class="grid"><label>DOI<input id="doi"></label><label>PMID<input id="pmid"></label><label>arXiv<input id="arxiv"></label><label>Year<input id="year" type="number" min="1" max="9999"></label></div><label>Journal<input id="journal"></label><label>Collection<select id="collection"><option value="">My library</option></select></label><p id="source"></p><button id="save">Save metadata</button><button id="queue" type="button">Keep offline</button></form>
<h2>Offline captures</h2><p>Pending captures stay on this device. Retry sends them to the connected library.</p><div id="outbox"></div><button id="forget" type="button">Forget token</button>
<script type="module" src="popup.js"></script></body></html>
