[package]
name = "autonomics-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Standalone analysis task worker for compute nodes"

[dependencies]
clap.workspace = true
datafusion.workspace = true
dag-core = { path = "../../crates/dag-core" }
data-engine = { path = "../../crates/data-engine", default-features = false, features = ["analysis"] }
container-runtime = { path = "../../crates/container-runtime" }
vfs = { path = "../../crates/vfs" }
# Match the coordinator's exact JSON float parsing for task specifications.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
libc.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
